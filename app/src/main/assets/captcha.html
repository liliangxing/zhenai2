<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 验证码程序依赖(必须)。请勿修改以下程序依赖，如通过其他手段规避加载，会导致验证码无法正常更新，对抗能力无法保证，甚至引起误拦截。 -->
    <script src="https://turing.captcha.qcloud.com/TCaptcha.js"></script>
    <style>
        body {
          background-color: transparent;
          margin: 0;
          padding: 0;
        }
    </style>
    <title>验证码接入</title>
</head>

<body>

<script type="text/javascript">
    function globalCallback(res) {
      window.jsBridge.getData(JSON.stringify(res));
    }
    // 验证码js加载错误处理
    function errorCallback() {
      globalCallback({
        ret: -1,
        randstr: '@' + Math.random().toString(36).substr(2),
        ticket: '',
        errorCode: 1001,
        errorMessage: 'jsload_error',
      });
    }
    // 定义验证码触发事件
    window.onload = function () {
      try {
        const sdkOptions = {
          needFeedBack: false,
          enableDarkMode: false,
          loading:false,
          ready: function (size) {
            // 与Android通信
            console.log('ready size:', JSON.stringify(size));
          }
        };
        const captcha = new TencentCaptcha('196425707', globalCallback, sdkOptions);
        // 调用方法，显示验证码
        captcha.show();
      } catch (error) {
        errorCallback();
      }
    }

</script>

</body>

</html>
