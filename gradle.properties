# 项目级配置
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# 网络超时(沙箱外网偶发慢)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.publish.checksums.insecure=true
# 强制 HTTP/1.1(沙箱透明代理对 HTTP/2 多路复用支持不佳)
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.org.gradle.internal.http.maxRetries=3

# 显式代理配置(沙箱代理端口 18080)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# 应用全局配置(供各模块引用)
APP_NAMESPACE=com.zhenai2.android
APPLICATION_ID=com.zhenai2.android
VERSION_CODE=1
VERSION_NAME=1.0.0
MIN_SDK=23
TARGET_SDK=34
COMPILE_SDK=34
